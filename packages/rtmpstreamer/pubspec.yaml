name: rtmpstreamer
description: Flutter Android RTMP streaming plugin with camera preview and on-the-fly screen sharing via MediaProjection.
version: 0.1.2
homepage: https://github.com/gitlad11/flutter_rtmp_screensharing
repository: https://github.com/gitlad11/flutter_rtmp_screensharing
issue_tracker: https://github.com/gitlad11/flutter_rtmp_screensharing/issues
topics:
  - rtmp
  - live-streaming
  - screen-sharing
  - camera
  - mediaprojection

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.gitlad.rtmpstreamer.flutter
        pluginClass: RtmpStreamerPlugin
